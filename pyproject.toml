[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hsc-match-bridge"
version = "0.1.0"
description = "HSC Match Bridge control-plane adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hsc-match-bridge = "hsc_match_bridge.main:main"

[tool.setuptools.packages.find]
where = ["src"]
